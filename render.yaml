services:
  - type: web
    name: graphmind-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: GRAPHMIND_DATA_DIR
        value: /tmp/graphmind-data
      - key: GRAPHMIND_CORS_ORIGINS
        sync: false
      - key: GRAPHMIND_MODEL_PROVIDER
        value: local
      - key: GRAPHMIND_LLM_API_KEY
        sync: false
      - key: GRAPHMIND_LLM_API_URL
        sync: false
      - key: GRAPHMIND_GROQ_API_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: GRAPHMIND_GROQ_API_KEY
        sync: false
      - key: GRAPHMIND_HUGGINGFACE_API_KEY
        sync: false
      - key: GRAPHMIND_GEMINI_API_KEY
        sync: false
